name: Fix VPS OpenRouter B64

on:
  push:
    paths:
      - '.github/workflows/fix-openrouter.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Fix OpenRouter
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            OR_KEY=$(echo 'c2stb3ItdjEtMjcwODJiNGMzYTgzYmI0YjdlMDk2NmQ1MzE5MmE3YmEyNDE1YjI3ZWEzYWJjNjY3OTc4YzU5ZWYyYWQ1MjRmYw==' | base64 -d)
            BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
            echo "Backend: $BACKEND"

            echo '1. Check current OPENROUTER lines in main.py:'
            docker exec $BACKEND grep -n 'OPENROUTER_API_KEY' /app/main.py | head -10

            echo ''
            echo '2. Direct sed patch: replace module-level assignment with hardcoded key'
            docker exec -e OR_KEY="$OR_KEY" $BACKEND sh -c '
              sed -i "s|OPENROUTER_API_KEY = os.getenv.*|OPENROUTER_API_KEY = \"$OR_KEY\"|" /app/main.py
              sed -i "s|OPENROUTER_API_KEY = os.environ.get.*|OPENROUTER_API_KEY = \"$OR_KEY\"|" /app/main.py
              echo "sed done"
            '

            echo ''
            echo '3. Verify patch:'
            docker exec $BACKEND grep -n 'OPENROUTER_API_KEY' /app/main.py | head -5

            echo ''
            echo '4. Restart backend process (kill uvicorn, docker will auto-restart)'
            docker restart $BACKEND
            sleep 8

            echo ''
            echo '5. Backend running:'
            docker ps | grep backend
            echo 'Last 5 logs:'
            docker logs $BACKEND 2>&1 | tail -5
