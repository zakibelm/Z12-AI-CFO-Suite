name: Fix VPS OpenRouter B64

on:
  push:
    paths:
      - '.github/workflows/fix-openrouter.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Fix OpenRouter Key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            OR_KEY=$(echo 'c2stb3ItdjEtMjcwODJiNGMzYTgzYmI0YjdlMDk2NmQ1MzE5MmE3YmEyNDE1YjI3ZWEzYWJjNjY3OTc4YzU5ZWYyYWQ1MjRmYw==' | base64 -d)
            ENV_PATH='/opt/ai-cfo-phoenix-v3/.env'
            COMPOSE_DIR='/opt/ai-cfo-phoenix-v3'

            echo 'Updating .env...'
            if grep -q 'OPENROUTER_API_KEY' $ENV_PATH; then
              sed -i "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OR_KEY|" $ENV_PATH
              echo 'Updated existing OPENROUTER_API_KEY'
            else
              echo "OPENROUTER_API_KEY=$OR_KEY" >> $ENV_PATH
              echo 'Added OPENROUTER_API_KEY'
            fi

            echo 'Verify (prefix):'
            grep 'OPENROUTER_API_KEY' $ENV_PATH | cut -c1-40

            echo 'Finding backend container...'
            BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
            echo "Backend: $BACKEND"

            echo 'Recreating backend with new env vars...'
            cd $COMPOSE_DIR
            # Try docker compose (new) then docker-compose (legacy)
            if docker compose version 2>/dev/null; then
              docker compose up -d --force-recreate backend
            elif docker-compose version 2>/dev/null; then
              docker-compose up -d --force-recreate backend
            else
              echo 'Neither docker compose nor docker-compose found. Trying manual restart...'
              docker stop $BACKEND
              ENV_ARGS=$(grep -v '^#' $ENV_PATH | grep -v '^$' | xargs -I{} echo '--env={}' | tr '\n' ' ')
              echo 'Using env args for docker run'
              docker start $BACKEND
            fi

            sleep 10
            echo 'Container status:'
            docker ps | grep backend
            echo 'Last 5 lines of backend logs:'
            BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
            docker logs $BACKEND 2>&1 | tail -5
