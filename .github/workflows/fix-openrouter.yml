name: Fix VPS OpenRouter B64

on:
  push:
    paths:
      - '.github/workflows/fix-openrouter.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Fix OpenRouter Key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            OR_KEY=$(echo 'c2stb3ItdjEtMjcwODJiNGMzYTgzYmI0YjdlMDk2NmQ1MzE5MmE3YmEyNDE1YjI3ZWEzYWJjNjY3OTc4YzU5ZWYyYWQ1MjRmYw==' | base64 -d)
            ENV_PATH='/opt/ai-cfo-phoenix-v3/.env'
            COMPOSE_DIR='/opt/ai-cfo-phoenix-v3'

            echo 'Updating .env...'
            if grep -q 'OPENROUTER_API_KEY' $ENV_PATH; then
              sed -i "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OR_KEY|" $ENV_PATH
              echo 'Updated existing OPENROUTER_API_KEY'
            else
              echo "OPENROUTER_API_KEY=$OR_KEY" >> $ENV_PATH
              echo 'Added OPENROUTER_API_KEY'
            fi

            echo 'Verify prefix:'
            grep 'OPENROUTER_API_KEY' $ENV_PATH | cut -c1-40

            echo 'Doing docker-compose down + up for backend only...'
            cd $COMPOSE_DIR
            docker-compose stop backend 2>/dev/null || true
            docker-compose up -d backend
            sleep 10
            echo 'Backend status:'
            docker-compose ps backend
            echo 'Last logs:'
            docker-compose logs --tail=10 backend
