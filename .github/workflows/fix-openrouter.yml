name: Fix VPS OpenRouter B64

on:
  push:
    paths:
      - '.github/workflows/fix-openrouter.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Fix OpenRouter
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script: |
            OR_KEY=$(echo 'c2stb3ItdjEtMjcwODJiNGMzYTgzYmI0YjdlMDk2NmQ1MzE5MmE3YmEyNDE1YjI3ZWEzYWJjNjY3OTc4YzU5ZWYyYWQ1MjRmYw==' | base64 -d)
            BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
            echo "Backend: $BACKEND"
            echo "1. Before patch:"
            docker exec $BACKEND grep -n 'OPENROUTER_API_KEY.*getenv' /app/main.py | head -3
            echo "2. Running Python patch:"
            echo '' | base64 -d > /tmp/fix_or.py
            docker cp /tmp/fix_or.py $BACKEND:/tmp/fix_or.py
            docker exec -e OR_KEY="$OR_KEY" $BACKEND python3 /tmp/fix_or.py
            echo "3. After patch:"
            docker exec $BACKEND grep -n 'OPENROUTER_API_KEY' /app/main.py | head -3
            echo "4. Restart backend:"
            docker restart $BACKEND
            sleep 8
            docker ps | grep backend
            docker logs $BACKEND --tail 5 2>&1
