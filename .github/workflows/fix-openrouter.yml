name: Fix VPS OpenRouter

on:
  push:
    paths:
      - '.github/workflows/fix-openrouter.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: SSH Fix OpenRouter Key
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OR_KEY
          script: |
            echo '=== Finding .env file ==='
            ENV_PATH=''
            if [ -f /opt/ai-cfo-phoenix-v3/.env ]; then
              ENV_PATH='/opt/ai-cfo-phoenix-v3/.env'
            elif [ -f /var/www/z12-cfo/.env ]; then
              ENV_PATH='/var/www/z12-cfo/.env'
            fi
            echo "ENV_PATH: $ENV_PATH"

            if [ -z "$OR_KEY" ]; then
              echo 'ERROR: OR_KEY secret is empty. Please set OPENROUTER_API_KEY secret in GitHub.'
              exit 1
            fi

            if [ -n "$ENV_PATH" ]; then
              if grep -q 'OPENROUTER_API_KEY' $ENV_PATH; then
                sed -i "s|OPENROUTER_API_KEY=.*|OPENROUTER_API_KEY=$OR_KEY|" $ENV_PATH
                echo 'Updated existing OPENROUTER_API_KEY'
              else
                echo "OPENROUTER_API_KEY=$OR_KEY" >> $ENV_PATH
                echo 'Added OPENROUTER_API_KEY to .env'
              fi
              echo 'Value set (first 20 chars):'
              grep 'OPENROUTER_API_KEY' $ENV_PATH | cut -c1-35

              echo 'Restarting backend container...'
              BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
              echo "Backend: $BACKEND"
              if [ -n "$BACKEND" ]; then
                docker restart $BACKEND
                sleep 5
                echo 'Backend restarted.'
                docker logs $BACKEND 2>&1 | tail -10
              fi
            else
              echo 'ERROR: .env not found. Searching...'
              find /opt /var/www -name '.env' 2>/dev/null | head -10
            fi
