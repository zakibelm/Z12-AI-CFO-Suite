name: Diagnose VPS v2

on:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Diagnose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
            echo "Backend: $BACKEND"
            echo ''
            echo '=== Container OPENROUTER_API_KEY env var ==='
            docker exec $BACKEND env | grep 'OPENROUTER'
            echo ''
            echo '=== Main.py chat endpoint (lines 438-470) ==='
            docker exec $BACKEND sed -n '430,480p' /app/main.py
            echo ''
            echo '=== Recent backend log (last 20 lines) ==='
            docker logs $BACKEND 2>&1 | tail -20
