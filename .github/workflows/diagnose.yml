name: Diagnose VPS v2

on:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Diagnose
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: 147.93.40.124
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo '=== docker-compose.yml env section ==='
            cat /opt/ai-cfo-phoenix-v3/docker-compose.yml | grep -A5 -B5 'OPENROUTER\|environment\|env_file'
            echo ''
            echo '=== Current backend container env vars ==='
            BACKEND=$(docker ps --format '{{.Names}}' | grep -i backend | head -1)
            docker exec $BACKEND env | grep -i 'openrouter\|api_key' 2>/dev/null || echo 'No OPENROUTER env var in container'
            echo ''
            echo '=== .env OPENROUTER line ==='
            grep 'OPENROUTER' /opt/ai-cfo-phoenix-v3/.env
            echo ''
            echo '=== Recent backend logs (401 openrouter) ==='
            docker logs $BACKEND 2>&1 | grep -i 'openrouter\|401\|api_key\|OPENROUTER' | tail -10
