<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#166534;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- White background -->
  <rect width="400" height="350" fill="white"/>
  <!-- Z letter (large, grey metallic) -->
  <text x="60" y="230" font-family="Arial Black, sans-serif" font-size="210" font-weight="900"
        fill="url(#zGrad)" filter="url(#shadow)" letter-spacing="-10">Z</text>
  <!-- Shadow/3D effect for Z -->
  <text x="64" y="234" font-family="Arial Black, sans-serif" font-size="210" font-weight="900"
        fill="rgba(0,0,0,0.15)" letter-spacing="-10" style="z-index:-1">Z</text>
  <!-- Bar chart (green bars going up) -->
  <rect x="205" y="55" width="14" height="50" fill="url(#greenGrad)" rx="2"/>
  <rect x="223" y="35" width="14" height="70" fill="url(#greenGrad)" rx="2"/>
  <rect x="241" y="20" width="14" height="85" fill="url(#greenGrad)" rx="2"/>
  <rect x="259" y="8" width="14" height="97" fill="url(#greenGrad)" rx="2"/>
  <!-- Arrow going up-right -->
  <path d="M200 115 Q260 60 300 10" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <polygon points="295,0 315,18 300,10 308,28" fill="#16a34a"/>
  <!-- 12 number (large, green) -->
  <text x="190" y="232" font-family="Arial Black, sans-serif" font-size="190" font-weight="900"
        fill="url(#greenGrad)" filter="url(#shadow)">12</text>
  <!-- AI CFO SUITE text -->
  <text x="200" y="275" font-family="Arial Black, sans-serif" font-size="32" font-weight="900"
        fill="#1a1a2e" text-anchor="middle" letter-spacing="3">AI CFO SUITE</text>
  <!-- Divider line -->
  <line x1="80" y1="285" x2="320" y2="285" stroke="#333" stroke-width="1.5"/>
  <!-- Diamond shape -->
  <polygon points="200,282 206,288 200,294 194,288" fill="#16a34a"/>
  <!-- Tagline -->
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="11" font-weight="600"
        fill="#2d5a3d" text-anchor="middle" letter-spacing="1">L'INTELLIGENCE FINANCIERE. VOS DONNEES. VOTRE CROISSANCE.</text>
</svg>